name: Vault Guard
description: Scan a repository for secrets with vault-guard and write a SARIF log. Run after actions/checkout.
author: Vault & Compass LLC
branding:
  icon: shield
  color: red

inputs:
  version:
    description: |
      The exact version of `@vaultcompass/vault-guard` to install, such as
      `1.7.0`. Validated against
      `^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$`, and the default is
      the SCANNER version this action tag shipped with, which is not always the
      same number as the tag: an action-only release moves the tag and leaves
      the scanner where it is.

      No leading zeros, which is what that pattern buys over three plain
      `[0-9]+` groups. `01.7.0` and `1.7.00` are not semver, so npm does not
      read them as versions at all and falls back to treating the spec as a
      dist-tag, which is the family this input exists to refuse.

      THIS USED TO DEFAULT TO `latest`, AND USED TO ACCEPT DIST-TAGS. Both are
      refused now, for two different reasons.

      A dist-tag means the program judging a pull request is whichever one the
      registry served that morning, rather than one decided in the workflow
      file and reviewable there.

      The sharper reason is that the old charset was not a version check at
      all. npm's specifier parser reads `@scope/name@<value>` as a PATH, not a
      version, when the value begins with a dot or ends in `.tgz`: `.`, `..`
      and `payload.tgz` all resolve against a directory instead of the
      registry. Combined with a step that ran from inside the checkout, that
      was one committed file away from the tree under judgment handing over its
      own scanner.

      A prerelease cannot be pinned either. The pattern that admits `-rc.1`
      admits most of what a dist-tag would, and the version deciding a pull
      request is not the place to widen a pattern for the convenience of
      testing one.
    required: false
    default: 1.7.0
  path:
    description: |
      Path to scan, relative to the workspace root. Must be 1..256 characters
      of `[A-Za-z0-9._/-]`, must not contain `..`, and must not begin with `-`,
      so it can neither escape `GITHUB_WORKSPACE` nor be read as an option by a
      command it reaches. A `./` prefix is fine. (The charset is checked with
      `+` plus a separate length guard, never `{1,256}`: BSD regex sets
      RE_DUP_MAX to 255, so `{1,256}` fails to compile on macOS and rejects
      every path including `.`.)
    required: false
    default: .
  format:
    description: Output format (one of `text`, `json`, `sarif`)
    required: false
    default: sarif
  sarif-output:
    description: |
      Where to write the results file, relative to the workspace root. Same
      path rules as `path`, and two more that exist because this input names a
      file the action WRITES rather than one it reads.

      It may not resolve under `.github/`, which holds the workflow file and
      the CODEOWNERS entry that decide how this gate runs and who may change
      them. Compared after normalising `./` segments and case, so `./.github/x`
      and `.GitHub/x` are refused too.

      It may not resolve through a symlink, at the file or at any directory on
      the way to it. The head controls those, and a symlink there would send
      the write outside the workspace.
    required: false
    default: vault-guard-results.sarif
  trust-base:
    description: |
      Pull-request mode. On a pull request the config, any
      `.vault-guard.local.json` and the baseline are read from the BASE ref
      instead of from the pull request's own tree, and the head tree is what
      gets scanned, so a pull request cannot turn the scanner off in the same
      commit that carries the secret.

      `auto` (the default) passes `--trust-base origin/$GITHUB_BASE_REF` when
      `GITHUB_BASE_REF` is set, which is exactly the pull-request events, and
      passes nothing otherwise. Any other value is used as the ref verbatim and
      must be 1..200 chars of `[A-Za-z0-9._/@^~-]`, and must not begin with
      `-`, so it cannot be read as an option by git.

      There is deliberately NO value that turns pull-request mode off. On a
      same-repo `pull_request` event GitHub runs the workflow file from the pull
      request head, so an off switch here would be settable by the pull request
      it is meant to judge: the boundary would come with its own off switch, on
      the untrusted side. Base-ref judging is the floor, not a knob. A
      tightening (a required review, a CODEOWNERS entry on the config paths) is
      the only kind of change this accepts, and it lives in repository settings.

      Your `actions/checkout` step needs `fetch-depth: 0` for the base branch
      to exist locally. Without it the scan exits 2 and says so rather than
      falling back to trusting the pull request. If you are not ready to change
      the checkout, stay pinned to `vaultcompasshq/vault-guard@v1.6.0` until you
      are, rather than looking for a switch here.

      **That escape hatch is a trade, and it is worth stating plainly: EVERY tag
      before v1.7.1 installs its scanner with `npx` from inside the checkout**,
      so on a pull-request run the tree being scanned can choose the program
      that scans it, through a committed `.npmrc` or a copy in its own
      `node_modules`. Pinning back buys time on `fetch-depth: 0` and gives up
      that boundary in exchange. Adding `fetch-depth: 0` is a one-line change to
      a workflow file; this is not, whatever it looks like from here.
    required: false
    default: auto

outputs:
  results-file:
    description: |
      Absolute path to the written results file, or empty when the scan wrote
      nothing at all. Exit 2 means vault-guard could not establish something it
      needed and never produced a document, and handing that empty file to
      `upload-sarif` fails the job with a parse error that buries the real
      cause. Guard a chained upload on this output being non-empty.
    value: ${{ steps.run.outputs.results_file }}
  exit-code:
    description: vault-guard's own exit code (0 clean, 1 findings at or above the gate, 2 could not run)
    value: ${{ steps.run.outputs.exit_code }}

runs:
  using: composite
  steps:
    # Consumers must run `actions/checkout` on their repository *before* this action.

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'

    # Validate every input before letting it touch the shell.
    #
    # Why a dedicated step (and not just inline regex in `run`):
    #   - GitHub Actions `${{ inputs.* }}` is template-substituted *before* the
    #     shell parses the script, so attacker-controlled input bypasses any
    #     amount of quoting in the script body.
    #   - The fix is to pass values via `env:` (which the shell expands at
    #     runtime), and then validate them with bash regex before use.
    - name: Validate inputs
      shell: bash
      env:
        VG_VERSION: ${{ inputs.version }}
        VG_PATH: ${{ inputs.path }}
        VG_FORMAT: ${{ inputs.format }}
        VG_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        VG_TRUST_BASE: ${{ inputs.trust-base }}
      run: |
        set -euo pipefail

        # EXACT VERSIONS ONLY. Not a range, not a dist-tag, not `latest`, and
        # the two things that refusal buys are different.
        #
        # A tag hands the choice of program to the registry on the morning of
        # the run, so the version that scans a pull request stops being a
        # decision written down in the workflow file.
        #
        # The other one is sharper. npm's specifier parser reads
        # `@scope/name@<value>` as a PATH, not a version, when the value begins
        # with a dot or ends in `.tgz`: `.`, `..` and `payload.tgz` all resolve
        # against a directory rather than the registry. A charset that let
        # those through would be one committed file away from the tree under
        # judgment choosing its own scanner, which is exactly what the old
        # `[0-9A-Za-z.+-]{1,64}` pattern allowed.
        #
        # No leading zeros in any of the three numbers. `01.7.0` and `1.7.00`
        # are not semver, so npm does not read them as versions at all: a spec
        # it cannot parse as a version falls back to being treated as a
        # DIST-TAG, which is the exact family this check exists to refuse.
        if [[ ! "${VG_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          printf '::error::vault-guard: the `version` input must be an exact version like 1.7.0, and was %q\n' "${VG_VERSION}"
          printf '::error::A dist-tag such as latest, a range, a version with a leading zero such as 01.7.0, or anything else is refused. A value beginning with a dot or ending in .tgz is read by npm as a path rather than a version.\n'
          printf '::error::If your workflow says `version: latest`, REMOVE the input: the default is the scanner version this action tag shipped with, which is the pin you want.\n'
          exit 1
        fi

        # SHAPE IS NOT CAPABILITY. The check above proves the input names a
        # version; it says nothing about whether that version understands the
        # arguments this tag is going to hand it.
        #
        # The whole reason the `version` input exists is to let a consumer pin a
        # scanner OTHER than the one this tag shipped with, so version skew is a
        # SUPPORTED configuration rather than a misuse. The run step passes
        # `--trust-base` on every pull-request run, and that flag arrived in
        # scanner 1.7.0. Handed to anything older, Commander answers `error:
        # unknown option '--trust-base'` and exits 1 -- the same code the scanner
        # uses for findings -- so a stale pin was reported to the repository as
        # secrets nobody found, from a scan that never started.
        #
        # This floor is therefore a property of THE FLAGS THIS TAG PASSES, not of
        # the tag number: raise it in the same commit that starts passing a newer
        # flag, and name that flag in the message so the reader is not sent to
        # the changelog to work out which two numbers disagree.
        VG_MIN_MAJOR=1
        VG_MIN_MINOR=7
        VG_MIN_PATCH=0
        VG_MIN_SCANNER="${VG_MIN_MAJOR}.${VG_MIN_MINOR}.${VG_MIN_PATCH}"

        # Matched again rather than read out of `BASH_REMATCH` from the check
        # above. That array does survive the `!` there, but a reader repairing
        # the shape check has no way to know this block is downstream of it, and
        # a silently emptied capture would compare against zeroes and let
        # everything through. The pattern is the same one deliberately, so the
        # two cannot drift into disagreeing about what a version is.
        if [[ ! "${VG_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          printf '::error::vault-guard: internal: %q passed the version shape check and then did not parse. Refusing rather than guessing.\n' "${VG_VERSION}"
          exit 1
        fi
        VG_MAJOR="${BASH_REMATCH[1]}"
        VG_MINOR="${BASH_REMATCH[2]}"
        VG_PATCH="${BASH_REMATCH[3]}"

        # Compared component by component, never as text: `1.10.0` sorts BELOW
        # `1.7.0` as a string and above it as a version, so a lexicographic
        # comparison here would refuse the newer scanner the floor exists to
        # keep. Arithmetic contexts read a leading zero as octal, which cannot
        # arrive because the pattern above refuses leading zeros.
        VG_TOO_OLD=0
        if (( VG_MAJOR < VG_MIN_MAJOR )); then
          VG_TOO_OLD=1
        elif (( VG_MAJOR == VG_MIN_MAJOR )); then
          if (( VG_MINOR < VG_MIN_MINOR )); then
            VG_TOO_OLD=1
          elif (( VG_MINOR == VG_MIN_MINOR )) && (( VG_PATCH < VG_MIN_PATCH )); then
            VG_TOO_OLD=1
          fi
        fi

        if (( VG_TOO_OLD == 1 )); then
          printf '::error::vault-guard: this action tag needs scanner %s or newer, and the `version` input asks for %s.\n' "${VG_MIN_SCANNER}" "${VG_VERSION}"
          printf '::error::The scan passes --trust-base on pull-request runs, and on every run when `trust-base` names an explicit ref. That flag arrived in scanner %s. An older scanner refuses it as an unknown option and exits 1, which is also its findings code, so the run would be reported as secrets found by a scan that never ran.\n' "${VG_MIN_SCANNER}"
          printf '::error::REMOVE the `version` input to take the scanner this action tag shipped with, which is the pin you want, or raise it to %s or newer. A `version` input that Dependabot does not move is a second pin in a place no automation looks.\n' "${VG_MIN_SCANNER}"
          exit 1
        fi

        # `off` was accepted before 1.7.0 shipped and is refused by name, so a
        # workflow carrying it gets told what happened rather than a confusing
        # "ref does not resolve" from a scan that tried to use `off` as a branch
        # name. It is gone because a same-repo pull_request event runs this
        # workflow file from the pull request head, which made it an off switch
        # for the boundary sitting on the untrusted side of it.
        #
        # Matched in any capitalisation, because a value refused as `off` and
        # accepted as `Off` would be an opt-out with a shift key in front of it:
        # git would then be asked for a ref named Off, fail to resolve it, and
        # the run would exit 2 for a reason nobody could read.
        case "${VG_TRUST_BASE}" in
          [Oo][Ff][Ff])
            printf '::error::vault-guard: `trust-base: off` was removed. Pull-request mode is not optional: on a same-repo pull_request event the workflow file runs from the pull request head, so an off switch here is settable by the pull request it judges.\n'
            printf '::error::Use `auto` (the default), or pin vaultcompasshq/vault-guard@v1.6.0 until you can add fetch-depth: 0 to actions/checkout.\n'
            printf '::error::Note what pinning back costs: every tag before v1.7.1 installs the scanner with npx from inside the checkout, so a pull request can choose the program that scans it with a committed .npmrc or a copy in its own node_modules. Adding fetch-depth: 0 is the smaller change.\n'
            exit 1
            ;;
        esac

        # format: closed enum.
        case "${VG_FORMAT}" in
          text|json|sarif) ;;
          *)
            printf '::error::vault-guard: invalid `format` input: %q\n' "${VG_FORMAT}"
            printf '::error::Allowed: text | json | sarif\n'
            exit 1
            ;;
        esac

        # path / sarif-output: relative paths within the workspace. No `..`
        # segments (path traversal), no leading `/` (absolute escape), no
        # leading `-`.
        #
        # Charset uses `+` plus an explicit length check — not `{1,256}`.
        # macOS bash/BSD regex sets RE_DUP_MAX=255, so `{1,256}` fails to
        # compile and every path (including `.`) is rejected as invalid.
        validate_path() {
          local name="$1"
          local value="$2"
          if [[ ! "${value}" =~ ^[A-Za-z0-9._/-]+$ ]] || (( ${#value} > 256 )); then
            printf '::error::vault-guard: invalid `%s` input: %q\n' "${name}" "${value}"
            printf '::error::Allowed: 1..256 chars of [A-Za-z0-9._/-]\n'
            exit 1
          fi
          # Reject any `..` segment. We do this as a separate check (not in the
          # regex) so the error message is precise.
          if [[ "${value}" == *".."* ]]; then
            printf '::error::vault-guard: `%s` must not contain `..`: %q\n' "${name}" "${value}"
            exit 1
          fi
          # Reject absolute paths.
          if [[ "${value}" == /* ]]; then
            printf '::error::vault-guard: `%s` must be relative to the workspace: %q\n' "${name}" "${value}"
            exit 1
          fi
          # The leading-dash rule is not about escaping the workspace, and it
          # applies to every value rather than only to the ref: a path or a ref
          # beginning with `-` is read as an OPTION by whichever command
          # vault-guard hands it to. Caught here, where the message can name the
          # workflow input that produced it, which git cannot.
          if [[ "${value}" == -* ]]; then
            printf '::error::vault-guard: `%s` must not begin with a dash: %q\n' "${name}" "${value}"
            exit 1
          fi
        }

        validate_path "path" "${VG_PATH}"
        validate_path "sarif-output" "${VG_SARIF_OUTPUT}"

        # NORMALISE FOR COMPARISON, do not refuse the spelling.
        #
        # A `.` path segment is a second name for the same file, so a guard
        # that compares strings can be walked past with `./`. Refusing any
        # value containing `./` would be wrong in a way that breaks working
        # repositories: `path: ./src` is ordinary Actions style and was
        # accepted by every earlier release, and a security upgrade that turns
        # a green check red is an upgrade people back out of.
        #
        # Lowercased as well, because a macOS runner's filesystem is
        # case-insensitive by default: `.GitHub/x` and `.github/x` are the same
        # directory there, and a case-sensitive comparison sees two strings.
        # Same reasoning as the `[Oo][Ff][Ff]` match above.
        #
        # Lowercased with `tr`, NOT with `${value,,}`. That expansion is a bash
        # 4.0 feature and macOS ships bash 3.2, where it is a SYNTAX ERROR
        # rather than a wrong answer: the whole step would fail to parse on the
        # one platform whose filesystem made the case-folding necessary in the
        # first place. Same family of bug as the `{1,256}` regex below.
        #
        # To a FIXED POINT, because the rewrites feed each other and applying
        # them once each in a fixed order leaves holes: stripping a leading
        # `./` from `.//.github/x` yields `/.github/x`, which then matches
        # neither `.github` nor `.github/*`.
        # A TRAILING SLASH is normalised away too, and that one is not only
        # about the `.github/` comparison. `test -L` FOLLOWS a symlink when the
        # path it is given ends in a slash, so `out.sarif/` names the same file
        # as `out.sarif` and walks straight past the symlink guard in the run
        # step; `dirname` then hands back the workspace and the loop ends having
        # checked nothing. Stripped here so every guard downstream sees one
        # spelling.
        normalise_path() {
          local value="$1"
          local previous=""
          while [[ "${value}" != "${previous}" ]]; do
            previous="${value}"
            value="${value//\/\//\/}"
            value="${value//\/.\//\/}"
            value="${value#./}"
            value="${value%/}"
          done
          printf '%s' "${value}" | tr '[:upper:]' '[:lower:]'
        }

        # `.github/` holds the workflow file and the CODEOWNERS entry that
        # decide how this gate runs and who may change it. A results file
        # written there is one upload, commit or artifact step away from landing
        # inside the path a reviewer is protecting.
        VG_SARIF_NORMALISED="$(normalise_path "${VG_SARIF_OUTPUT}")"

        # `.`, `./`, `/` and friends all normalise to nothing or to a single
        # dot, and every one of them names a DIRECTORY. This input names a file
        # the action writes, so the redirect would fail deep inside the run step
        # with a shell error about a directory rather than here, with the name
        # of the workflow input that caused it.
        if [[ -z "${VG_SARIF_NORMALISED}" || "${VG_SARIF_NORMALISED}" == "." ]]; then
          printf '::error::vault-guard: `sarif-output` must name a file, not a directory: %q\n' "${VG_SARIF_OUTPUT}"
          exit 1
        fi

        if [[ "${VG_SARIF_NORMALISED}" == ".github" || "${VG_SARIF_NORMALISED}" == ".github/"* ]]; then
          printf '::error::vault-guard: `sarif-output` must not write under .github/: %q\n' "${VG_SARIF_OUTPUT}"
          printf '::error::That directory holds the workflow file and the CODEOWNERS entry that decide how this gate runs. Write the results somewhere else.\n'
          exit 1
        fi

        # trust-base: the `auto` keyword, or a git ref. The ref charset excludes
        # everything the shell would treat specially; it is also only ever used
        # as a quoted array element below, so this is defence in depth rather
        # than the only thing standing between a branch name and the shell.
        if [[ "${VG_TRUST_BASE}" != "auto" ]]; then
          if [[ ! "${VG_TRUST_BASE}" =~ ^[A-Za-z0-9._/@^~-]+$ ]] || (( ${#VG_TRUST_BASE} > 200 )); then
            printf '::error::vault-guard: invalid `trust-base` input: %q\n' "${VG_TRUST_BASE}"
            printf '::error::Allowed: auto | a git ref, 1..200 chars of [A-Za-z0-9._/@^~-]\n'
            exit 1
          fi
          if [[ "${VG_TRUST_BASE}" == -* ]]; then
            printf '::error::vault-guard: `trust-base` must not begin with a dash: %q\n' "${VG_TRUST_BASE}"
            exit 1
          fi
        fi

        # GITHUB_BASE_REF is the pull request's TARGET branch, so it names a
        # branch that already exists in this repository rather than anything a
        # fork author chose. It is still checked, because `auto` turns it into
        # part of a command line without anyone having typed it.
        if [[ "${VG_TRUST_BASE}" == "auto" && -n "${GITHUB_BASE_REF:-}" ]]; then
          if [[ ! "${GITHUB_BASE_REF}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            printf '::error::vault-guard: refusing GITHUB_BASE_REF: %q\n' "${GITHUB_BASE_REF}"
            printf '::error::Pass an explicit `trust-base` ref instead.\n'
            exit 1
          fi
        fi

    # THE SCANNER COMES FROM OUTSIDE THE TREE IT SCANS. Running vault-guard with
    # `npx` from inside the checkout put the whole choice of program inside the
    # tree under judgment, by two separate routes. A `.npmrc` committed by the
    # head repoints the registry npx fetches from. A
    # `node_modules/@vaultcompass/vault-guard` already present in the head, from
    # the workflow's own earlier install step, is what npx runs, with the
    # version pin acting only as a satisfaction check on a package the head
    # wrote. Now the package is installed from the registry at the version
    # pinned in the caller's workflow file, under a prefix in the runner temp,
    # and invoked from there by absolute path.
    #
    # WHAT THAT PIN DOES AND DOES NOT PROTECT. It takes the choice of program
    # out of the tree: the head's lockfile, manifest, node_modules and .npmrc no
    # longer decide what runs. It does not take that choice out of the workflow
    # file. On a pull_request event GitHub runs the workflow as it is in the
    # pull request's merge commit, so a pull request that edits the workflow can
    # change this pin, or delete the step outright, the same as it could rewrite
    # any other CI step; only pull_request_target runs the base branch's copy,
    # and that event carries the base's secrets and is the wrong one for judging
    # untrusted code. The control for a workflow edit is branch protection on
    # the base branch, with review required for the workflow path, and nothing
    # this action does can substitute for it. The boundary here is against the
    # TREE choosing its own judge.
    #
    # IT RUNS OUTSIDE THE CHECKOUT TOO, not just installs outside it. A
    # composite step with no working-directory runs at the workspace root, which
    # is the head's own tree: npm would then be started with the pull request's
    # .npmrc, package.json and lockfile under its cwd. In global mode npm does
    # not read a project's own configuration, so nothing here is known to depend
    # on that, and that is exactly why the step should not rest on it: the
    # reason it is safe would be a property of a version of npm rather than of
    # this file. Running from the runner temp costs nothing and takes the
    # question away.
    - name: Install vault-guard outside the workspace
      id: install
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        # Under the runner temp, which is outside the workspace and is cleaned
        # up by the runner. npm reads this variable itself, so nothing here has
        # to pass --prefix on a command line.
        npm_config_prefix: ${{ runner.temp }}/vault-guard-action
        VG_VERSION: ${{ inputs.version }}
      run: |
        set -eu
        mkdir -p "${npm_config_prefix}"

        # THE VERIFICATION BELOW NEEDS npm 10.5.2 OR NEWER, AND SAYS SOMETHING
        # ALARMING AND FALSE ON AN OLDER ONE.
        #
        # `npm audit signatures` is not version-stable. Below 10.5.2 it fails
        # on a CLEAN, untampered install of these very packages, because the
        # client's bundled keys and TUF root are stale rather than because
        # anything is wrong. On 10.5.0 it reports "Someone might have tampered
        # with these packages since they were published on the registry!",
        # naming ours. On 10.2.4 it is EEXPIREDSIGNATUREKEY.
        #
        # Bisected against a real install with a COLD CACHE AND A FRESH HOME,
        # so no newer client could have primed the TUF root or the key set:
        # 8.19.4, 9.9.4, 10.2.4, 10.5.0 and 10.5.1 fail; 10.5.2 and every later
        # version pass, with 10.5.2 verifying the same package and attestation
        # counts as current npm rather than a reduced set.
        #
        # THE FLOOR WAS 10.6.0 UNTIL A REVIEW CHECKED IT. That number came from
        # a bisection that tested 10.5.0 and then 10.6.0 and never tested what
        # lay between them, and it was written down in three actions, three
        # changelogs and an invariants file as a measured fact. It was wrong by
        # two patch versions, and NODE 20.13.0 AND 20.13.1 SHIP npm 10.5.2, so
        # the floor was hard-refusing real consumers with a message telling
        # them their client could not do something it could.
        #
        # THE SETUP-NODE STEP ABOVE IS NOT SUFFICIENT, which is why this check
        # is here and not only in the sibling action that installs no Node.
        # `node-version: '22'` is a major-only spec and NODE 22.0.0 SHIPS npm
        # 10.5.1, inside the failing band. `setup-node` satisfies a major from
        # the runner's tool cache when it can, so a self-hosted or custom-image
        # runner holding 22.0.0 gets a client this verification cannot use. An
        # earlier version of this branch reasoned that the step above made the
        # floor unnecessary; that reasoning was wrong, and nothing in this
        # repository would have caught the step being lowered or removed.
        #
        # Pulled out as the first version-shaped token rather than validated
        # and then split. A shape check with `grep -Eq` matches PER LINE while
        # the arithmetic reads the WHOLE string, so a client printing an
        # upgrade notice above its version passed the check and then failed the
        # comparison, leaving the floor skipped. `|| true` because grep exits 1
        # on no match under `set -e`; output with no version in it yields the
        # empty string and is refused.
        NPM_VERSION="$(npm --version 2>/dev/null | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
        if [ -z "${NPM_VERSION}" ]; then
          printf '::error::vault-guard: could not read an npm version to check. Refusing rather than assuming the client can verify signatures.\n'
          exit 1
        fi
        NPM_MAJOR="${NPM_VERSION%%.*}"
        NPM_REST="${NPM_VERSION#*.}"
        NPM_MINOR="${NPM_REST%%.*}"
        NPM_PATCH="${NPM_REST#*.}"

        # WRITTEN AS "ACCEPT ONLY IF PROVABLY OK", NOT "REFUSE IF BAD".
        #
        # `[` returns 2 on a malformed comparison, and an `if` reads 2 as
        # false. A refuse-if-bad shape therefore turns any arithmetic error
        # into permission to proceed, which is precisely how the first two
        # versions of this guard failed open. Here an error leaves NPM_OK at 0
        # and the step refuses, so the failure direction is closed by
        # construction rather than by getting the expression right.
        NPM_OK=0
        if [ "${NPM_MAJOR}" -gt 10 ] 2>/dev/null; then
          NPM_OK=1
        elif [ "${NPM_MAJOR}" -eq 10 ] 2>/dev/null; then
          if [ "${NPM_MINOR}" -gt 5 ] 2>/dev/null; then
            NPM_OK=1
          elif [ "${NPM_MINOR}" -eq 5 ] 2>/dev/null && [ "${NPM_PATCH}" -ge 2 ] 2>/dev/null; then
            NPM_OK=1
          fi
        fi

        if [ "${NPM_OK}" -ne 1 ]; then
          printf '::error::vault-guard: npm %s cannot verify package signatures. This action needs npm 10.5.2 or newer; below that npm reports valid packages as tampered with, because its own bundled keys are stale.\n' "${NPM_VERSION}"
          printf '::error::Pin a Node release carrying a newer npm. Node 20.13.0 and later, and 22.1.0 and later, are fine; 22.0.0 ships npm 10.5.1 and is not. Or pin vaultcompasshq/vault-guard@v1.7.2, which does not verify.\n'
          exit 1
        fi

        # `--ignore-scripts`, because this step runs on a runner holding the
        # job's token and the thing being installed is a CONTROL INPUT. Without
        # it, every package in the resolved tree gets arbitrary code execution
        # here on every run, which is a strange amount of trust to extend from
        # the tool whose job is deciding whether this repository can be
        # trusted.
        #
        # It costs nothing, and the real reason is simpler than the one this
        # comment used to give. NO PACKAGE ANYWHERE IN THE PUBLISHED TREE HAS
        # an install, preinstall, postinstall or prepare script, so the flag
        # removes nothing that would have run. `better-sqlite3` is the only
        # native dependency, it ships prebuilds for every platform in its
        # tarball, and it is in any case an OPTIONAL dependency of the
        # telemetry package whose store degrades when its bindings are missing
        # (`store-unavailable.test.ts`). That degradation path is a backstop
        # rather than what makes this safe, and saying so matters: a future
        # dependency that DID add an install script would invalidate the
        # argument without anyone noticing, because the backstop would still be
        # there. Measured: two real global installs, one with the flag and one
        # without, scan the same clean tree to byte-identical output apart from
        # the timestamp, both exiting 0.
        npm install -g --ignore-scripts "@vaultcompass/vault-guard@${VG_VERSION}"

        # A ROOT MANIFEST, WITHOUT WHICH THE NEXT COMMAND SKIPS THE ONE PACKAGE
        # IT EXISTS TO CHECK.
        #
        # `npm audit signatures` audits the tree's EDGES OUT: it loads the
        # local prefix and walks what the root declares as dependencies. A
        # global install leaves `<prefix>/lib` holding a `node_modules` and NO
        # manifest, so the root declares nothing and the package just installed
        # is not on the far end of any edge. Its transitive dependencies are,
        # so they get audited and the scanner itself does not.
        #
        # Measured, because the discrepancy is quiet: the install reports
        # `added 13 packages` and, without this file, the audit reports
        # `audited 12`. Adding it takes the same tree to 13 audited and 5
        # attestations. The first version of this step shipped without it and
        # recorded that 12 as evidence the check worked.
        printf '{"name":"vault-guard-action-verify","private":true,"dependencies":{"@vaultcompass/vault-guard":"%s"}}\n' \
          "${VG_VERSION}" > "${npm_config_prefix}/lib/package.json"

        # WHAT THIS COMMAND PROVES, narrowly, because the tempting summary is
        # false. It asks the registry for each name and version in the tree and
        # checks the registry signature served back.
        #
        # It does NOT read the installed files. `pacote` refetches the manifest
        # rather than hashing anything on disk, so a tampered install is
        # invisible: appending a payload to the installed binary and re-running
        # this exits 0.
        #
        # It does NOT defeat a compromised registry, which signs what it
        # serves. And a MISSING attestation is not a failure -- only a missing
        # or invalid signature is -- so it does not require provenance either,
        # despite these packages publishing it.
        #
        # What remains is still worth having: every name and version in the
        # tree, the scanner included, has to be one npmjs currently serves with
        # a valid registry signature. That catches an unpublished, replaced or
        # unsigned package at the moment of install.
        #
        # Fails closed under `set -eu`, deliberately. KNOWN CONSEQUENCE: a
        # consumer whose runner points npm at a mirror or proxy that does not
        # serve `/-/npm/v1/keys` installs fine and then fails here with
        # EMISSINGSIGNATUREKEY, and a sigstore or TUF outage does the same to
        # everyone at once. That trade is written down in
        # docs/GITHUB_ACTION.md rather than left for a consumer to discover
        # from a red required check.
        #
        # Run from the prefix's `lib`, which is where a global install puts the
        # tree npm reads. Linux and macOS layout, the same assumption the PATH
        # line below already makes.
        cd "${npm_config_prefix}/lib"
        npm audit signatures

    - name: Run vault-guard
      id: run
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        # The binary the install step just wrote, by absolute path rather than
        # by name. A bare name would be resolved against PATH, and a workflow
        # that put its own node_modules/.bin on PATH before this action would
        # hand the head's copy back the resolution the install step took away.
        #
        # WHAT THIS DOES NOT BUY. The shim it points at starts with
        # `#!/usr/bin/env node`, so the INTERPRETER is still a PATH lookup. A
        # workflow that adds the checkout's node_modules/.bin to GITHUB_PATH,
        # together with a head that declares a dependency whose `bin` map
        # contains `node`, still chooses the interpreter. That needs the
        # workflow's cooperation, which puts it in the same class as a pull
        # request editing the workflow file, declared out of scope above -- but
        # the absolute path is not a complete answer on its own and should not
        # be read as one.
        #
        # THE LAYOUT ASSUMED HERE IS THE LINUX AND MACOS ONE, where a global
        # install puts its shims in <prefix>/bin. On Windows npm puts them in
        # the prefix directory itself, and this path would not exist.
        VG_BIN: ${{ runner.temp }}/vault-guard-action/bin/vault-guard
        VG_PATH: ${{ inputs.path }}
        VG_FORMAT: ${{ inputs.format }}
        VG_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        VG_TRUST_BASE: ${{ inputs.trust-base }}
      run: |
        set -euo pipefail

        ROOT="${GITHUB_WORKSPACE}"
        RESULTS_FILE=""

        # TRAILING SLASHES STRIPPED before the path is built, because `test -L`
        # FOLLOWS a symlink when the path ends in one: `out.sarif/` and
        # `out.sarif` name the same file, and only the first walks past the
        # symlink guard below. The validate step refuses a value that is nothing
        # but slashes and dots, so this cannot strip the whole input away.
        SARIF_REL="${VG_SARIF_OUTPUT}"
        while [[ "${SARIF_REL}" == */ ]]; do
          SARIF_REL="${SARIF_REL%/}"
        done
        OUT="${ROOT}/${SARIF_REL}"

        # ABSOLUTE, built from the workspace. This step starts in the runner
        # temp rather than in the checkout, so a relative scan path would
        # resolve against the wrong directory.
        #
        # PHYSICAL, via `pwd -P`, and that is not tidiness. vault-guard resolves
        # the pull-request file set against its own process cwd, which node
        # reports resolved; bash's `cd` keeps the LOGICAL path. Hand it a
        # logical `/var/...` scan target while its cwd reads `/private/var/...`
        # and every file in the head tree falls outside the target by
        # path.relative, so the run scans ZERO files and reports a clean result
        # over nothing. Found by bench/action-install.cjs on a macOS temp
        # directory, where /var is a symlink; it would be silent on a Linux
        # runner, whose workspace path happens to be canonical already, which is
        # exactly the kind of difference not to leave resting on luck.
        if ! SCAN_ROOT="$(cd "${ROOT}/${VG_PATH}" && pwd -P)"; then
          printf '::error::vault-guard: the `path` input does not name a directory in the checkout: %q\n' "${VG_PATH}"
          exit 1
        fi

        # And it has to still be INSIDE the checkout once the links are
        # resolved. The string rules in the validate step constrain the spelling
        # -- no `..`, no leading slash -- and the head controls the directories
        # those names point at, so a committed symlink is a second name for
        # somewhere else entirely. Without this, `path: src` with a `src` link
        # could put the runner's own filesystem into a SARIF the caller uploads.
        ROOT_REAL="$(cd "${ROOT}" && pwd -P)"
        if [[ "${SCAN_ROOT}" != "${ROOT_REAL}" && "${SCAN_ROOT}" != "${ROOT_REAL}/"* ]]; then
          printf '::error::vault-guard: the `path` input resolves outside the workspace, through a symlink: %q resolves to %q\n' "${VG_PATH}" "${SCAN_ROOT}"
          exit 1
        fi

        # A symlink is not covered by the `..` and leading-slash rules, which
        # constrain the STRING. The head controls the default filename and
        # every directory on the way to it, so it can commit a symlink anywhere
        # along that path pointing outside the workspace, and the write below
        # would follow it. That cannot change this run's verdict -- the scan has
        # not happened yet and the file is written after it -- but it can
        # clobber a file a later step in the caller's workflow reads.
        #
        # EVERY COMPONENT, not just the leaf and its parent: a `reports`
        # symlink with a `reports/sub/out.sarif` target writes outside the
        # workspace just as well as a symlinked leaf does.
        #
        # BEFORE `mkdir -p`, not after, so a refused run has not already
        # created directories through the attacker's symlink on its way to
        # refusing.
        CURSOR="${OUT}"
        while [[ "${CURSOR}" != "${ROOT}" && "${CURSOR}" != "/" ]]; do
          if [[ -L "${CURSOR}" ]]; then
            printf '::error::vault-guard: `sarif-output` resolves through a symlink at %q, which would write outside the path it names: %q\n' "${CURSOR}" "${VG_SARIF_OUTPUT}"
            printf '::error::Remove the symlink from the repository, or point sarif-output somewhere else.\n'
            exit 1
          fi
          CURSOR="$(dirname "${CURSOR}")"
        done

        mkdir -p "$(dirname "${OUT}")"

        # THE SCANNER'S CWD IS THE SCAN ROOT, and that is not the same decision
        # as where npm ran. The step itself starts in the runner temp, which is
        # what keeps the install and this invocation away from the head's
        # `.npmrc` and `node_modules`; the scanner is then pointed at the tree
        # it is here to scan.
        #
        # vault-guard anchors a directory scan at its own process cwd: the
        # config and any `.vault-guard.local.json` are loaded from there, the
        # trust base is resolved from there, and every path it renders,
        # serialises into SARIF and fingerprints into the baseline is relative
        # to it. Left in the runner temp it would look for the repository in a
        # directory that is not one, fail to resolve `origin/<base>`, and exit 2
        # on EVERY pull-request run -- with a message telling the caller to
        # fetch the base branch with `fetch-depth: 0`, which they already did.
        # A permanently red required check explained by advice that cannot fix
        # it. The binary is absolute, so what it IS was decided before this
        # line; this line decides only what it looks at.
        cd "${SCAN_ROOT}"

        # Do NOT put a bare `--` between the program and `scan`. It would be
        # forwarded into vault-guard's argv; Commander then treats it as
        # end-of-options and ignores `--format`, so the text banners
        # (🔍 Scanning…) land in the SARIF file and upload-sarif fails. That
        # was a real bug in the npx spelling of this step, and the shape is
        # still worth naming here so it does not come back in a new form.
        ARGS=(scan "${SCAN_ROOT}" --format "${VG_FORMAT}")

        # Pull-request mode. Built as an ARRAY rather than a string so the ref
        # stays one argv element: a branch name is not a place to discover that
        # word splitting exists. `auto` fires exactly on the pull-request
        # events, which are the ones where the tree being scanned belongs to
        # the author rather than to the repository.
        TRUST_ARGS=()
        if [[ "${VG_TRUST_BASE}" == "auto" ]]; then
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            TRUST_ARGS=(--trust-base "origin/${GITHUB_BASE_REF}")
          fi
        else
          TRUST_ARGS=(--trust-base "${VG_TRUST_BASE}")
        fi

        # `tee` rather than a plain redirect, because `format: text` exists and
        # a text report nobody can read in the job log is not a report. The
        # file gets exactly what the scanner wrote to stdout either way; the
        # bug this used to have was never `tee`, it was the bare `--` above
        # making the scanner ignore `--format`.
        set +e
        # `${TRUST_ARGS[@]+...}` rather than a bare `"${TRUST_ARGS[@]}"`: with
        # `set -u`, bash 3.2 (still what a macOS runner ships) treats an empty
        # array expansion as an unbound variable and aborts the step.
        "${VG_BIN}" "${ARGS[@]}" ${TRUST_ARGS[@]+"${TRUST_ARGS[@]}"} | tee "${OUT}"
        SCAN_STATUS="${PIPESTATUS[0]}"
        set -e

        # Published only when there is something in it. vault-guard exits
        # before writing any document when it could not run at all -- an
        # unresolvable trust base, a base config that fails validation -- and
        # `tee` has already created the target by then, so the file exists and
        # is zero bytes. Handing that path to upload-sarif fails the job with a
        # SARIF parse error, which buries the real cause under a complaint
        # about the upload.
        REPORTED=0
        if [[ -s "${OUT}" ]]; then
          RESULTS_FILE="${OUT}"
          REPORTED=1
        else
          printf 'vault-guard: nothing was written to %s (the scan exited %s first), so there is nothing to upload.\n' "${OUT}" "${SCAN_STATUS}"
        fi

        # A VERDICT REQUIRES A REPORT, AND THE EXIT CODE ALONE IS NOT ONE.
        #
        # The status says what the scanner decided; whether anything was written
        # says whether it got far enough to decide. Both arms of reading the
        # status by itself are wrong when the report is empty, and they are wrong
        # in opposite directions:
        #
        #   exit 1, no report. Commander exits 1 on an unknown option and writes
        #   the message to STDERR, so the teed report stays empty. 1 is also the
        #   findings code, so the action accused a repository of carrying secrets
        #   because the scanner could not parse its own argv. Version skew is the
        #   realistic way in -- see the scanner floor in "Validate inputs" -- and
        #   findings would have produced findings, so this cannot be them.
        #
        #   exit 0, no report. The same inference on the arm that fails OPEN: a
        #   clean scan prints its report, so an exit 0 with nothing written is
        #   not a clean tree, it is a scan that did not happen, and calling it
        #   clean passes a pull request that nothing looked at.
        #
        # Only 0, 1 and 2 are vault-guard's. Everything else, including the 126
        # and 127 the SHELL produces when the binary is missing or not
        # executable, is could-not-run and is re-raised as 2, so a required
        # check still fails and the message says why rather than claiming
        # findings nobody found.
        #
        # MAPPED BEFORE IT IS PUBLISHED, not after. The `exit-code` output
        # documents three values, and a caller reading it is doing so precisely
        # to tell a verdict from a failure to reach one. Publishing the raw
        # shell status here and mapping only the step's own exit would hand that
        # caller a 127 the contract says cannot happen, which is the same bug
        # class as reporting a failed install as findings, one layer out.
        if [[ "${REPORTED}" -eq 0 ]]; then
          EXIT_CODE=2
        else
          case "${SCAN_STATUS}" in
            0|1|2)
              EXIT_CODE="${SCAN_STATUS}"
              ;;
            *)
              EXIT_CODE=2
              ;;
          esac
        fi

        echo "results_file=${RESULTS_FILE}" >> "${GITHUB_OUTPUT}"
        echo "exit_code=${EXIT_CODE}" >> "${GITHUB_OUTPUT}"

        # Exit 2 is excluded here, and that exclusion is the whole point of the
        # condition. The scanner's reachable exit-2 paths -- an unresolvable
        # trust base, a scan target outside the base repo -- write to stderr and
        # no report, so they land in this branch too, and the generic message
        # below would tell someone whose real problem is a missing
        # `fetch-depth: 0` to go and check their `version` input. The scanner
        # already said what happened; the arm at the bottom of the case names
        # the trust base. A status of 2 is the scanner reporting could-not-run
        # itself, which needs no inference from whether it wrote anything.
        if [[ "${REPORTED}" -eq 0 ]] && [[ "${SCAN_STATUS}" -ne 2 ]]; then
          printf '::error::vault-guard did not produce a result: the scan exited %s and wrote no report, so there is nothing a verdict could be read from. This is not findings and it is not a clean scan. The usual causes are a scanner that refused an argument this action tag passed (check the `version` input against the tag) and a binary that failed to run at all. Reported as could not run.\n' "${SCAN_STATUS}"
          exit 2
        fi

        case "${SCAN_STATUS}" in
          0)
            exit 0
            ;;
          1)
            printf '::error::vault-guard found secrets at or above the gate (exit 1).\n'
            exit 1
            ;;
          2)
            printf '::error::vault-guard could not complete its checks (exit 2): an unresolvable trust base, a base config that fails validation, or a file it could not read. This is not a clean scan.\n'
            exit 2
            ;;
          *)
            printf '::error::vault-guard did not produce a result: the scan exited %s, which is not one of the three codes vault-guard itself uses. The installed binary failed to run, so nothing scanned this change. Reported as could not run.\n' "${SCAN_STATUS}"
            exit 2
            ;;
        esac
