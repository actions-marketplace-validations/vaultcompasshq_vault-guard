name: Release
#
# Two kinds of release come through here, decided by the "Decide the
# release kind" step below:
#
#   * a PACKAGE release, where the tag reads "v" + the version every
#     published package carries. Everything in this file runs.
#   * an ACTION-ONLY release, where the tag moves past the scanner version
#     and the packages stay where they are: action.yml, README, CHANGELOG
#     and docs moved, no package did. The code gates above still run on
#     it -- they are what covers the action.yml and docs such a release
#     actually ships. What is skipped is everything that exists to protect
#     a publish that does not happen: the packed-tarball hygiene check,
#     the npm upgrade for OIDC trusted publishing, and the publish itself.
#     The run then resolves the tag and cuts a GitHub Release saying
#     nothing was published.
#
# scripts/lib/release-kind.mjs holds the rules for telling the two apart
# and the reasoning behind each one; scripts/tests/release-kind.test.mjs
# holds the cases, including a canary against the real action.yml and the
# real CHANGELOG.md. Ported from dep-guard's release.yml -- see that
# repository's docs/INVARIANTS.md, "The action tag and the scanner version
# are two numbers", for the longer history. This repository has no
# equivalent invariants doc yet, so this comment and the ones on the
# decision step and the gated steps below are where that reasoning lives
# here.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      # Exactly "true" or "false", written by the decision step, and only
      # after every condition in scripts/lib/release-kind.mjs held.
      #
      # Every condition that reads it is spelled POSITIVELY -- publish-side
      # steps run on "== 'false'", the action-only Release body on
      # "== 'true'" -- never "!= 'true'". The difference only shows up when
      # the value is neither: an output that is empty or missing (a step
      # renamed, an id typo, a future edit that fails to set it) makes
      # "!= 'true'" TRUE, which would publish on a run that never decided
      # anything. Both spellings are equally readable and only one of them
      # fails closed.
      action_only: ${{ steps.kind.outputs.action_only }}

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.14.0
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'

    # Runs before pnpm install on purpose: every mistake this catches is a
    # human mistake made at tag time -- a mistyped tag, a version left
    # unbumped, a forgotten CHANGELOG entry -- and none of it depends on
    # anything install, build or test produce. scripts/classify-release-tag.mjs
    # reads the four packages' package.json files via "node -p", talks to
    # the npm registry on the action-only path only, and uses node builtins
    # only (no dependency of this repository is installed yet, and that
    # script must keep it that way).
    #
    # A tag equal to "v" + the version every package carries is a package
    # release, and everything proceeds as it always has. Any other tag is
    # an action-only CANDIDATE, and is refused unless it is exact semver,
    # strictly greater than the package version by numeric ordering,
    # written down as a "## [X.Y.Z]" entry in CHANGELOG.md at the tagged
    # commit, backed by every published package already being on the npm
    # registry at that package version, and matched by action.yml's own
    # version default. The package path is checked too, not merely
    # admitted: it requires action.yml's version default to equal the
    # version being published, since otherwise the tag the release creates
    # installs a different scanner than the release put on npm.
    #
    # The script writes action_only and scanner_version to $GITHUB_OUTPUT
    # itself, so nothing here parses its stdout.
    - name: Decide the release kind, and refuse a tag that is neither
      id: kind
      run: |
        set -euo pipefail
        CORE_NAME="$(node -p "require('./packages/core/package.json').name")"
        CORE_VERSION="$(node -p "require('./packages/core/package.json').version")"
        CLI_NAME="$(node -p "require('./packages/cli/package.json').name")"
        CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
        MCP_NAME="$(node -p "require('./packages/mcp/package.json').name")"
        MCP_VERSION="$(node -p "require('./packages/mcp/package.json').version")"
        TELEMETRY_NAME="$(node -p "require('./packages/telemetry/package.json').name")"
        TELEMETRY_VERSION="$(node -p "require('./packages/telemetry/package.json').version")"

        # GITHUB_REF_TYPE is always set by Actions (a branch name on
        # workflow_dispatch, a tag name on a tag push). The script's answer
        # for a run without --tag is always "package release".
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          node scripts/classify-release-tag.mjs \
            --tag "${GITHUB_REF_NAME}" \
            --package "${CORE_NAME}=${CORE_VERSION}" \
            --package "${CLI_NAME}=${CLI_VERSION}" \
            --package "${MCP_NAME}=${MCP_VERSION}" \
            --package "${TELEMETRY_NAME}=${TELEMETRY_VERSION}" \
            --action-yml action.yml \
            --changelog CHANGELOG.md
        else
          node scripts/classify-release-tag.mjs \
            --package "${CORE_NAME}=${CORE_VERSION}" \
            --package "${CLI_NAME}=${CLI_VERSION}" \
            --package "${MCP_NAME}=${MCP_VERSION}" \
            --package "${TELEMETRY_NAME}=${TELEMETRY_VERSION}" \
            --action-yml action.yml \
            --changelog CHANGELOG.md
        fi

        echo "Release kind decided: ref_type=${GITHUB_REF_TYPE} ref_name=${GITHUB_REF_NAME}"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Regenerate docs/RULES.md and check for drift
      run: node scripts/gen-rules-doc.cjs && git diff --exit-code docs/RULES.md

    - name: Run tests with coverage
      run: pnpm test:coverage

    # The release-kind decision above is covered by its own suite rather
    # than pnpm test:coverage, since it lives outside every package's own
    # tests directory. Runs on both kinds of release, same as every other
    # code gate here: the decision step ran before this suite could, so a
    # regression here would only be caught after the fact, but it is what
    # keeps the parser and the workflow wiring honest between releases.
    - name: Run release-kind tests
      run: pnpm test:release-kind

    # Runs here as well as in ci.yml. CI gates the pull request; this gates
    # the tag. Without it a release cut from a branch that never opened a
    # pull request, or an admin merge during a CI outage, could publish a
    # tarball carrying a private codename or an internal path, which is the
    # one thing this guard exists to make impossible.
    - name: Check for private portfolio references
      run: pnpm check:private-names

    - name: Assert CHANGELOG.md documents this version
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing the ## [${version}] entry for this release."
            exit 1
          fi
        else
          echo "Not a tag push; skipping the CHANGELOG entry check."
        fi

    # Skipped on an action-only release: nothing publishes on that path, so
    # there is no packed tarball for this to check the hygiene of.
    - name: Verify publish hygiene (no source maps or test artifacts in tarballs)
      if: steps.kind.outputs.action_only == 'false'
      run: pnpm check:pack

    # npm Trusted Publishing (OIDC): no NPM_TOKEN; auth via id-token: write +
    # trusted publisher on each @vaultcompass/* package (workflow: release.yml).
    # Requires npm CLI >= 11.5.1 (Node >= 22.14.0). Pin major 11 — npm@12 needs newer Node.
    - name: Upgrade npm for OIDC trusted publishing
      if: steps.kind.outputs.action_only == 'false'
      run: npm install -g npm@11

    # Only @vaultcompass/* packages — never vault-guard-vscode (Marketplace via vsce).
    # Skip versions already on the registry so a failed mid-release can be re-run.
    - name: Publish to npm
      if: steps.kind.outputs.action_only == 'false'
      run: |
        set -euo pipefail
        for dir in packages/core packages/telemetry packages/cli packages/mcp; do
          name="$(node -p "require('./${dir}/package.json').name")"
          ver="$(node -p "require('./${dir}/package.json').version")"
          if [[ "$(npm view "${name}@${ver}" version 2>/dev/null || true)" == "${ver}" ]]; then
            echo "Skip ${name}@${ver} (already on registry)"
            continue
          fi
          echo "Publishing ${name}@${ver}"
          pnpm --filter "${name}" publish --access public --no-git-checks
        done

    - name: Resolve release tag
      id: meta
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=v$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
        fi

    # Two Release steps, one per release kind, rather than one step with a
    # computed body. The body is the only difference between them, and it
    # is the part that must not be wrong: "Published ... to npm" appears
    # under exactly one condition, the same condition that let the publish
    # step run at all, so an action-only release cannot announce a publish
    # that did not happen.
    - name: Create GitHub Release
      if: steps.kind.outputs.action_only == 'false'
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ steps.meta.outputs.tag }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        body: |
          Published `@vaultcompass/vault-guard`, `@vaultcompass/vault-guard-core`, `@vaultcompass/vault-guard-mcp`, and `@vaultcompass/vault-guard-telemetry` to npm (VS Code extension is Marketplace-only, not npm). See [CHANGELOG.md](https://github.com/vaultcompasshq/vault-guard/blob/main/CHANGELOG.md).

    # The action-only body. It has to answer the question a reader of this
    # Release page actually has -- "the tag moved, so what am I getting?"
    # -- which is a scanner version that did not move with it.
    - name: Create GitHub Release (action-only)
      if: steps.kind.outputs.action_only == 'true'
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ steps.meta.outputs.tag }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        body: |
          Action-only release. `${{ steps.meta.outputs.tag }}` moves the composite action; the scanner it installs stays at `${{ steps.kind.outputs.scanner_version }}`, which was already on npm before this tag.

          Nothing was published to npm by this release.

          See CHANGELOG.md for what changed.

  smoke-published:
    name: Smoke test published CLI
    needs: release
    # Nothing was published on an action-only release, so there is nothing
    # here to smoke test: every command below installs
    # @vaultcompass/vault-guard at the version derived from the tag, and on
    # an action-only tag that version does not exist on the registry and
    # never will.
    if: needs.release.outputs.action_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fixture only)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install published package and assert scan fails on fixture
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="$(node -p "require('./packages/cli/package.json').version")"
          fi
          echo "Smoke testing @vaultcompass/vault-guard@${VERSION}"

          FOUND=0
          for i in $(seq 1 12); do
            if [[ "$(npm view "@vaultcompass/vault-guard@${VERSION}" version 2>/dev/null)" == "${VERSION}" ]]; then
              echo "Package visible on registry."
              FOUND=1
              break
            fi
            echo "Waiting for npm registry (attempt ${i}/12)…"
            sleep 10
          done
          if [[ "${FOUND}" -ne 1 ]]; then
            echo "::error::Timed out waiting for @vaultcompass/vault-guard@${VERSION} on the npm registry."
            exit 1
          fi

          WORK="${GITHUB_WORKSPACE}"
          FIXTURE="${WORK}/fixtures/release-smoke"
          TMP=$(mktemp -d)
          cd "${TMP}"
          npm init -y >/dev/null 2>&1
          npm install "@vaultcompass/vault-guard@${VERSION}"

          set +e
          ./node_modules/.bin/vault-guard scan "${FIXTURE}" --format json > smoke-out.json 2>smoke-err.log
          EC=$?
          set -e

          if [[ "${EC}" -eq 0 ]]; then
            echo "::error::Expected vault-guard scan to exit non-zero (fixture contains a synthetic secret pattern)."
            cat smoke-err.log || true
            exit 1
          fi

          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('smoke-out.json', 'utf8'));
            const n = j.summary && j.summary.secrets;
            if (!(typeof n === 'number' && n > 0)) {
              console.error('Bad JSON summary', j);
              process.exit(1);
            }
          "
          echo "Release smoke passed."
