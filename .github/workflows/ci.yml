name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # `engines` declares node >=22, so every major in that range must be
        # tested. 24.x and 25.x were previously untested and broke on
        # better-sqlite3 native bindings (telemetry + proxy suites).
        node-version: [22.x, 24.x, 25.x]

    name: test (node ${{ matrix.node-version }})

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Verify publish hygiene (no source maps or test artifacts in tarballs)
      run: pnpm check:pack

    - name: Regenerate docs/RULES.md and check for drift
      run: node scripts/gen-rules-doc.cjs && git diff --exit-code docs/RULES.md

    - name: Run tests with coverage
      run: pnpm test:coverage

    - name: Security audit
      run: pnpm audit --audit-level high
  test-windows:
    name: test (windows)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Run unit tests (core + CLI; no hook/proxy integration)
      run: pnpm test:windows

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint code
      run: pnpm lint

    - name: Check for private portfolio references
      run: pnpm check:private-names

  # action.yml path validation must work on macOS bash (RE_DUP_MAX=255).
  # Ubuntu alone cannot catch a `{1,N}` regression above that limit.
  action-path-validation:
    name: action path validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Validate action path inputs
      run: bash scripts/test-action-path-validation.sh

  bench:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Run benchmark regression gate
      run: node bench/run.cjs --assert

  # The guardrail gates, run through the conductor umbrella at the ci stage.
  # A job of its own rather than steps inside test: it needs
  # security-events: write to upload a SARIF log, and the test job has no
  # business carrying that permission. It is not a required check. It reports.
  guardrails:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        # Required. The intent gate measures this branch against its merge
        # base, and a shallow checkout has no merge base to diff against.
        # That gate fails closed rather than checking an empty path set,
        # because an empty path set is what a passing gate looks like.
        fetch-depth: 0

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run the guardrail gates
      id: conductor
      uses: vaultcompasshq/conductor@45d2ecc2213244408495c22d0b8da1dc0f1ed288 # v0.4.0
      with:
        output: conductor.sarif

    - name: Upload the SARIF log
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      # Always: the log is most worth having on the run that failed.
      if: always()
      # The sarif path is published BEFORE the gates run, so on the exit 2
      # cases that fail before anything is written (a policy error, an
      # unknown stage, an unwritable output path) it names a file that was
      # never created. Publishing early is the right trade for the common
      # case, which is exit 1 with a real log; this step just has to tolerate
      # the file being missing rather than failing the job a second time
      # over it.
      continue-on-error: true
      with:
        sarif_file: ${{ steps.conductor.outputs.sarif }}
