name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # `engines` declares node >=22, so every major in that range must be
        # tested. 24.x and 25.x were previously untested and broke on
        # better-sqlite3 native bindings (telemetry + proxy suites).
        node-version: [22.x, 24.x, 25.x]

    name: test (node ${{ matrix.node-version }})

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Verify publish hygiene (no source maps or test artifacts in tarballs)
      run: pnpm check:pack

    - name: Regenerate docs/RULES.md and check for drift
      run: node scripts/gen-rules-doc.cjs && git diff --exit-code docs/RULES.md

    - name: Run tests with coverage
      run: pnpm test:coverage

    # Runs here, not only in release.yml's own "Run release-kind tests"
    # step, so a canary that breaks (the real action.yml, the real
    # CHANGELOG.md) fails on the pull request that broke it rather than
    # only being discovered at tag time.
    - name: Run release-kind tests
      run: pnpm test:release-kind

    - name: Security audit
      run: pnpm audit --audit-level high
  test-windows:
    name: test (windows)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    # WHAT THIS JOB IS FOR: the SCANNER on Windows. `scan`, `check` and the MCP
    # server are supported there, and this job is what keeps them working.
    #
    # `test:windows` also excludes the action suites under `__tests__/action`,
    # and that exclusion is a statement about scope rather than a failure being
    # swept up. Those suites execute action.yml's own `run:` blocks under
    # `bash --noprofile --norc -eo pipefail` against `#!/bin/sh` stub binaries
    # the harness writes. None of that is a thing Windows runs, so on this
    # runner every one of them failed at the same place: the stub never
    # executed, the file it was supposed to write back stayed empty, and the
    # assertion read `Received string: ""`. That is the harness being
    # unrunnable here, not the action being broken, and it says nothing about
    # whether the scanner works on Windows.
    #
    # There is also no Windows behaviour for them to cover: the composite
    # action is Linux and macOS only by design. See the comment at the install
    # step in action.yml -- a global npm install puts its shims in
    # `<prefix>/bin` on those platforms and in the prefix directory itself on
    # Windows, which would put an empty directory on PATH.
    #
    # THIS JOB WAS RED ON MAIN from 2026-09-13 to 2026-09-16, across the whole
    # v1.7.1 release, and nobody was told, because it is not a required check.
    # Worth remembering before adding another job nobody watches: a check that
    # fails where no one is looking is not a check.
    - name: Run unit tests (core + CLI; no hook/proxy integration)
      run: pnpm test:windows

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint code
      run: pnpm lint

    - name: Check for private portfolio references
      run: pnpm check:private-names

  # action.yml path validation must work on macOS bash (RE_DUP_MAX=255).
  # Ubuntu alone cannot catch a `{1,N}` regression above that limit.
  action-path-validation:
    name: action path validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Validate action path inputs
      run: bash scripts/test-action-path-validation.sh

  bench:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Run benchmark regression gate
      run: node bench/run.cjs --assert

  # The guardrail gates, run through the conductor umbrella at the ci stage.
  # A job of its own rather than steps inside test: it needs
  # security-events: write to upload a SARIF log, and the test job has no
  # business carrying that permission. It is a required check on main, which
  # is why the trailer guard below lives here.
  guardrails:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
    - name: Refuse pull requests with bot co-author trailers
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        pattern='^Co-authored-by:.*(cursoragent@cursor\.com|noreply@anthropic\.com|\[bot\])'
        commits_json="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" | jq -s 'add')"
        count="$(echo "$commits_json" | jq 'length')"
        failures=0
        while IFS= read -r commit; do
          sha="$(echo "$commit" | jq -r '.sha')"
          message="$(echo "$commit" | jq -r '.commit.message')"
          trailer="$(printf '%s\n' "$message" | grep -iE "$pattern" || true)"
          if [ -n "$trailer" ]; then
            echo "Offending commit: $sha"
            echo "Trailer: $trailer"
            echo "Co-author trailers from editor agents put a bot account in the contributors graph; remove the trailer with git commit --amend and re-push."
            failures=1
          fi
        done < <(echo "$commits_json" | jq -c '.[]')
        if [ "$failures" -eq 1 ]; then
          exit 1
        fi
        echo "Checked $count commit(s) for bot co-author trailers; none found."

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Required. The intent gate measures this branch against its merge
        # base, and a shallow checkout has no merge base to diff against.
        # That gate fails closed rather than checking an empty path set,
        # because an empty path set is what a passing gate looks like.
        fetch-depth: 0

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run the guardrail gates
      id: conductor
      uses: vaultcompasshq/conductor@45d2ecc2213244408495c22d0b8da1dc0f1ed288 # v0.4.0
      with:
        output: conductor.sarif

    - name: Upload the SARIF log
      uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
      # Always: the log is most worth having on the run that failed.
      if: always()
      # The sarif path is published BEFORE the gates run, so on the exit 2
      # cases that fail before anything is written (a policy error, an
      # unknown stage, an unwritable output path) it names a file that was
      # never created. Publishing early is the right trade for the common
      # case, which is exit 1 with a real log; this step just has to tolerate
      # the file being missing rather than failing the job a second time
      # over it.
      continue-on-error: true
      with:
        sarif_file: ${{ steps.conductor.outputs.sarif }}
